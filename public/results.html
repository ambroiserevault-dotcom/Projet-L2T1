<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Résultats de la salle</title>
<link rel="stylesheet" href="style.css">
<style>
  /* ── Reset & base ───────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body.page-results {
    font-family: "Segoe UI", sans-serif;
    background: #f7f8fb;
    color: #1e1e2f;
    min-height: 100vh;
  }

  /* ── Wrapper ────────────────────────────────────────────────── */
  .results-wrapper {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ── Page header ────────────────────────────────────────────── */
  .results-header {
    margin-bottom: 32px;
  }
  .results-header h1 {
    font-size: 1.9rem;
    color: #7a0026;
    margin-bottom: 6px;
  }
  .results-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .room-badge {
    background: #7a0026;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
    letter-spacing: .5px;
  }
  .status-badge {
    font-size: 13px;
    color: #555;
    background: #e8e8f0;
    padding: 4px 12px;
    border-radius: 999px;
  }

  /* ── Cards ──────────────────────────────────────────────────── */
  .result-card {
    background: #fff;
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 8px 28px rgba(0,0,0,.07);
    margin-bottom: 24px;
  }

  .card-title {
    font-size: 1rem;
    font-weight: 700;
    color: #7a0026;
    text-transform: uppercase;
    letter-spacing: .6px;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid #f0f0f5;
  }

  /* ── Global overview: two panels side by side ───────────────── */
  .overview-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  @media (max-width: 620px) {
    .overview-grid { grid-template-columns: 1fr; }
  }

  .panel-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: #888;
    margin-bottom: 14px;
  }

  /* ── Questionnaire bars (bidirectionnel -2/+2) ──────────────── */
  .q-bar-row {
    display: grid;
    grid-template-columns: 120px 1fr 46px;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .q-bar-label { color: #444; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q-bar-track {
    position: relative;
    background: #edf0f7;
    height: 12px;
    border-radius: 999px;
    overflow: hidden;
  }
  .q-bar-track::after {
    content: "";
    position: absolute;
    left: 50%; top: 0; bottom: 0;
    width: 2px;
    background: rgba(0,0,0,.12);
  }
  .q-bar-fill {
    position: absolute;
    top: 0; bottom: 0;
    width: 0;
  }
  .q-bar-neg { right: 50%; background: linear-gradient(90deg, #4d9cff, #1c6df6); border-radius: 999px 0 0 999px; }
  .q-bar-pos { left:  50%; background: linear-gradient(90deg, #ff9e9e, #f76b6b); border-radius: 0 999px 999px 0; }
  .q-bar-value { text-align: right; font-weight: 600; color: #333; font-size: 12px; }

  /* ── Emotion bars ───────────────────────────────────────────── */
  .emo-bar-row {
    display: grid;
    grid-template-columns: 110px 1fr 40px;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .emo-bar-label { color: #444; }
  .emo-bar-track {
    height: 12px;
    border-radius: 999px;
    background: #edf0f7;
    overflow: hidden;
  }
  .emo-bar-fill {
    height: 100%;
    border-radius: 999px;
    transition: width .4s ease;
  }
  .emo-bar-pct { text-align: right; font-weight: 600; color: #555; font-size: 12px; }

  /* ── Dominant emotion pill ──────────────────────────────────── */
  .dominant-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 14px;
    padding: 5px 14px;
    border-radius: 999px;
    background: #f6eaf5;
    border: 1px solid rgba(122,0,38,.15);
    font-size: 13px;
    font-weight: 600;
    color: #7a0026;
  }
  .dominant-pill span { font-size: 11px; font-weight: 400; color: #888; }

  /* ── No data placeholder ────────────────────────────────────── */
  .no-data {
    font-size: 13px;
    color: #aaa;
    font-style: italic;
    padding: 8px 0;
  }

  /* ── Section label (between groups of cards) ────────────────── */
  .section-label {
    font-size: 1.1rem;
    font-weight: 700;
    color: #1e1e2f;
    margin: 32px 0 16px;
  }

  /* ── User card header ───────────────────────────────────────── */
  .user-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid #f0f0f5;
  }
  .user-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7a0026, #c1003a);
    color: #fff;
    font-weight: 700;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .user-name { font-weight: 700; font-size: 1rem; color: #1e1e2f; }
  .user-email { font-size: 12px; color: #888; margin-top: 2px; }
  .user-id { font-size: 11px; color: #bbb; margin-top: 2px; font-family: monospace; }

  /* ── Per-user data grid ─────────────────────────────────────── */
  .user-data-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  @media (max-width: 620px) {
    .user-data-grid { grid-template-columns: 1fr; }
  }

  /* ── Section header row (label + copy button) ──────────────── */
  .section-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 32px 0 16px;
    flex-wrap: wrap;
  }
  .section-header .section-label { margin: 0; }
  .copy-feedback {
    font-size: 13px;
    color: #7a0026;
    font-weight: 600;
    opacity: 0;
    transition: opacity .2s ease;
  }
  .copy-feedback.visible { opacity: 1; }

  /* ── Action buttons ─────────────────────────────────────────── */
  .results-actions {
    margin-top: 36px;
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 13px 22px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    font-family: "Segoe UI", sans-serif;
    text-decoration: none;
    transition: background .15s ease, transform .1s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary   { background: #7a0026; color: #fff; }
  .btn.primary:hover { background: #5f001d; }
  .btn.secondary { background: #ebebf2; color: #1e1e2f; }
  .btn.secondary:hover { background: #dcdce8; }

  /* ── Circular chart wrapper ─────────────────────────────────── */
  .chart-circle-wrapper {
    max-width: 260px;
    margin: 8px auto 0;
  }

  /* ── Timeline charts ─────────────────────────────────────────── */
  .timeline-card canvas { display: block; max-height: 260px; }
  .timeline-note {
    font-size: 12px;
    color: #aaa;
    font-style: italic;
    margin-top: 10px;
  }
</style>
</head>

<body class="page-results">
<div class="results-wrapper">

  <!-- Page header -->
  <div class="results-header">
    <h1>Résultats de la salle</h1>
    <div class="results-meta">
      <span class="room-badge" id="roomBadge">—</span>
      <span class="status-badge" id="statusBadge">Chargement…</span>
    </div>
  </div>

  <!-- Results injected here -->
  <div id="results"></div>

  <!-- Actions -->
  <div class="results-actions">
    <button id="finalCloseBtn"      class="btn primary">Fermer définitivement la salle</button>
    <button id="backToDashboardBtn" class="btn secondary" onclick="window.location.href='dashboard.html'">Retour au tableau de bord</button>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
const params       = new URLSearchParams(window.location.search);
const room         = params.get("room");
const isHistorical = params.get("historical") === "true";
const socket       = io();

document.getElementById("roomBadge").textContent = room ? `Salle ${room}` : "—";

if (!room) {
  document.getElementById("statusBadge").textContent = "Aucune salle fournie";
}

// ── Couleurs catégories questionnaire ────────────────────────────────────────
const CATEGORY_COLORS = {
  "stress":        "#ef4444",
  "fatigue":       "#f97316",
  "confiance":     "#22c55e",
  "motivation":    "#3b82f6",
  "concentration": "#8b5cf6",
  "anxiété":       "#ec4899",
  "bien-etre":     "#14b8a6"
};

// ── Méta émotions ────────────────────────────────────────────────────────────
const EMOTION_META = {
  happy:     { label: "😊 Heureux",  color: "#f59e0b" },
  neutral:   { label: "😐 Neutre",   color: "#6b7280" },
  sad:       { label: "😢 Triste",   color: "#3b82f6" },
  angry:     { label: "😠 Colère",   color: "#ef4444" },
  surprised: { label: "😲 Surpris",  color: "#f97316" },
  fearful:   { label: "😨 Peur",     color: "#8b5cf6" },
  disgusted: { label: "🤢 Dégoûté",  color: "#22c55e" },
  surprise:  { label: "😲 Surpris",  color: "#f97316" },
  fear:      { label: "😨 Peur",     color: "#8b5cf6" },
  disgust:   { label: "🤢 Dégoûté",  color: "#22c55e" }
};

// ── Helpers ───────────────────────────────────────────────────────────────────
function initialsOf(profile) {
  const f = (profile.firstName || "")[0] || "";
  const l = (profile.lastName  || "")[0] || "";
  return (f + l).toUpperCase() || "?";
}

function fullName(profile) {
  return [profile.firstName, profile.lastName].filter(Boolean).join(" ").trim();
}

// ── Section questionnaire (radar) ────────────────────────────────────────────
function buildQuestionnairePanel(categories, scores) {
  const panel = document.createElement("div");

  const title = document.createElement("div");
  title.className   = "panel-title";
  title.textContent = "Questionnaire";
  panel.appendChild(title);

  const hasAny = categories.some(c => scores[c] !== null && scores[c] !== undefined);
  if (!hasAny) {
    const nd = document.createElement("p");
    nd.className   = "no-data";
    nd.textContent = "Aucune réponse enregistrée.";
    panel.appendChild(nd);
    return panel;
  }

  const wrapper = document.createElement("div");
  wrapper.className = "chart-circle-wrapper";
  const canvas = document.createElement("canvas");
  wrapper.appendChild(canvas);
  panel.appendChild(wrapper);

  new Chart(canvas, {
    type: "radar",
    data: {
      labels: categories,
      datasets: [{
        label:               "Score",
        data:                categories.map(cat => { const v = scores[cat]; return (v !== null && v !== undefined) ? v : 0; }),
        backgroundColor:     "rgba(122, 0, 38, 0.12)",
        borderColor:         "#7a0026",
        borderWidth:         2,
        pointBackgroundColor: "#7a0026",
        pointRadius:         4,
        pointHoverRadius:    6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { display: false } },
      scales: {
        r: {
          min: -2, max: 2,
          ticks: { stepSize: 1, font: { size: 10 }, backdropColor: "transparent" },
          pointLabels: { font: { size: 11 }, color: "#444" },
          grid:        { color: "rgba(0,0,0,0.08)" },
          angleLines:  { color: "rgba(0,0,0,0.08)" }
        }
      }
    }
  });

  return panel;
}

// ── Section émotions (donut) ─────────────────────────────────────────────────
function buildEmotionPanel(emotions, dominantEmotion) {
  const panel = document.createElement("div");

  const title = document.createElement("div");
  title.className   = "panel-title";
  title.textContent = "Émotions détectées";
  panel.appendChild(title);

  const entries = Object.entries(emotions || {});
  const total   = entries.reduce((s, [, v]) => s + Number(v || 0), 0);

  if (!total) {
    const nd = document.createElement("p");
    nd.className   = "no-data";
    nd.textContent = "Aucune donnée d'émotion enregistrée.";
    panel.appendChild(nd);
    return panel;
  }

  if (dominantEmotion && EMOTION_META[dominantEmotion]) {
    const pill = document.createElement("div");
    pill.className = "dominant-pill";
    pill.innerHTML = `${EMOTION_META[dominantEmotion].label} <span>dominante</span>`;
    panel.appendChild(pill);
  }

  const wrapper = document.createElement("div");
  wrapper.className = "chart-circle-wrapper";
  const canvas = document.createElement("canvas");
  wrapper.appendChild(canvas);
  panel.appendChild(wrapper);

  const valid = entries
    .filter(([key]) => EMOTION_META[key] && Number(emotions[key]) > 0)
    .sort(([, a], [, b]) => Number(b) - Number(a));

  new Chart(canvas, {
    type: "doughnut",
    data: {
      labels:   valid.map(([key]) => EMOTION_META[key].label),
      datasets: [{
        data:            valid.map(([, v]) => Math.round((Number(v) / total) * 100)),
        backgroundColor: valid.map(([key]) => EMOTION_META[key].color),
        borderWidth:     2,
        borderColor:     "#fff"
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      cutout: "58%",
      plugins: {
        legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 }, padding: 8 } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed}%` } }
      }
    }
  });

  return panel;
}

// ── Timeline émotions ────────────────────────────────────────────────────────
function buildEmotionTimelineCard(emotionTimeline) {
  const card = document.createElement("div");
  card.className = "result-card timeline-card";

  const title = document.createElement("div");
  title.className   = "card-title";
  title.textContent = "Évolution des émotions — salle entière (webcam)";
  card.appendChild(title);

  if (!emotionTimeline || emotionTimeline.length < 2) {
    const nd = document.createElement("p");
    nd.className   = "no-data";
    nd.textContent = "Données insuffisantes pour afficher l'évolution (au moins 2 points nécessaires).";
    card.appendChild(nd);
    return card;
  }

  const canvas = document.createElement("canvas");
  card.appendChild(canvas);

  const t0     = emotionTimeline[0].t;
  const labels = emotionTimeline.map(e => {
    const secs = Math.round((e.t - t0) / 1000);
    return secs < 60 ? `${secs}s` : `${(secs / 60).toFixed(1)} min`;
  });

  const datasets = Object.entries(EMOTION_META)
    .filter(([key]) => !["surprise", "fear", "disgust"].includes(key))
    .map(([key, meta]) => ({
      label:           meta.label,
      data:            emotionTimeline.map(e => e.emotions[key] || 0),
      borderColor:     meta.color,
      backgroundColor: meta.color + "33",
      borderWidth:     2,
      pointRadius:     3,
      tension:         0.35,
      fill:            false
    }))
    .filter(ds => ds.data.some(v => v > 0));

  new Chart(canvas, {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true,
      plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 12 } } } },
      scales: {
        y: { min: 0, max: 100, ticks: { callback: v => v + "%" }, title: { display: true, text: "Part (%)" } },
        x: { title: { display: true, text: "Temps écoulé" } }
      }
    }
  });

  const note = document.createElement("p");
  note.className   = "timeline-note";
  note.textContent = `${emotionTimeline.length} points de mesure enregistrés.`;
  card.appendChild(note);

  return card;
}

// ── Timeline questionnaire ────────────────────────────────────────────────────
function buildQuestionnaireTimelineCard(questionnaireTimeline, categories) {
  const card = document.createElement("div");
  card.className = "result-card timeline-card";

  const title = document.createElement("div");
  title.className   = "card-title";
  title.textContent = "Évolution des scores — salle entière (questionnaire)";
  card.appendChild(title);

  if (!questionnaireTimeline || questionnaireTimeline.length < 2) {
    const nd = document.createElement("p");
    nd.className   = "no-data";
    nd.textContent = "Données insuffisantes pour afficher l'évolution (au moins 2 envois de questions nécessaires).";
    card.appendChild(nd);
    return card;
  }

  const canvas = document.createElement("canvas");
  card.appendChild(canvas);

  const labels   = questionnaireTimeline.map((_, i) => `Envoi ${i + 1}`);
  const datasets = categories.map(cat => ({
    label:           cat,
    data:            questionnaireTimeline.map(e => e.scores[cat] ?? null),
    borderColor:     CATEGORY_COLORS[cat] || "#7a0026",
    backgroundColor: (CATEGORY_COLORS[cat] || "#7a0026") + "33",
    borderWidth:     2,
    pointRadius:     4,
    tension:         0.35,
    fill:            false,
    spanGaps:        true
  })).filter(ds => ds.data.some(v => v !== null));

  new Chart(canvas, {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true,
      plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 12 } } } },
      scales: {
        y: {
          min: -2, max: 2,
          ticks: { stepSize: 0.5 },
          title: { display: true, text: "Score moyen" }
        }
      }
    }
  });

  const note = document.createElement("p");
  note.className   = "timeline-note";
  note.textContent = `${questionnaireTimeline.length} envoi(s) de questions enregistré(s).`;
  card.appendChild(note);

  return card;
}

// ── Rendu principal ───────────────────────────────────────────────────────────
function renderResults(data) {
  const container = document.getElementById("results");
  container.innerHTML = "";

  const categories      = data.categories      || Object.keys(data.overall || {});
  const overall         = data.overall         || {};
  const users           = data.users           || {};
  const overallEmotions = data.overallEmotions || {};

  document.getElementById("statusBadge").textContent =
    data._historical ? "Résultats historiques" : "Résultats finaux";

  // ── Vue globale ───────────────────────────────────────────────────────────
  const globalCard = document.createElement("div");
  globalCard.className = "result-card";

  const globalTitle = document.createElement("div");
  globalTitle.className   = "card-title";
  globalTitle.textContent = "Vue globale de la salle";
  globalCard.appendChild(globalTitle);

  const overviewGrid = document.createElement("div");
  overviewGrid.className = "overview-grid";
  overviewGrid.appendChild(buildQuestionnairePanel(categories, overall));
  overviewGrid.appendChild(buildEmotionPanel(overallEmotions, null));
  globalCard.appendChild(overviewGrid);

  container.appendChild(globalCard);

  // ── Timelines (salle entière) ─────────────────────────────────────────────
  container.appendChild(buildEmotionTimelineCard(data.emotionTimeline || []));
  container.appendChild(buildQuestionnaireTimelineCard(data.questionnaireTimeline || [], categories));

  // ── Par participant ───────────────────────────────────────────────────────
  if (Object.keys(users).length === 0) return;

  const emails = Object.values(users)
    .map(u => (u.profile || {}).email)
    .filter(Boolean);

  const sectionHeader = document.createElement("div");
  sectionHeader.className = "section-header";

  const sectionLabel = document.createElement("div");
  sectionLabel.className   = "section-label";
  sectionLabel.textContent = "Résultats par participant";
  sectionHeader.appendChild(sectionLabel);

  if (emails.length > 0) {
    const copyBtn = document.createElement("button");
    copyBtn.className   = "btn secondary";
    copyBtn.textContent = "📋 Copier les emails";
    copyBtn.style.padding = "8px 16px";
    copyBtn.style.fontSize = "13px";

    const feedback = document.createElement("span");
    feedback.className = "copy-feedback";
    feedback.textContent = "Emails copiés ✓";

    copyBtn.onclick = () => {
      navigator.clipboard.writeText(emails.join("; "))
        .then(() => {
          feedback.classList.add("visible");
          setTimeout(() => feedback.classList.remove("visible"), 2500);
        })
        .catch(() => {
          feedback.textContent = emails.join("; ");
          feedback.classList.add("visible");
        });
    };

    sectionHeader.appendChild(copyBtn);
    sectionHeader.appendChild(feedback);
  }

  container.appendChild(sectionHeader);

  for (const userId in users) {
    const userData  = users[userId];
    const profile   = userData.profile || {};
    const name      = fullName(profile);
    const initials  = initialsOf(profile);

    const card = document.createElement("div");
    card.className = "result-card";

    // Header
    const header = document.createElement("div");
    header.className = "user-header";

    const avatar = document.createElement("div");
    avatar.className   = "user-avatar";
    avatar.textContent = initials;
    header.appendChild(avatar);

    const info = document.createElement("div");
    if (name) {
      const nameEl = document.createElement("div");
      nameEl.className   = "user-name";
      nameEl.textContent = name;
      info.appendChild(nameEl);
    }
    if (profile.email) {
      const emailEl = document.createElement("div");
      emailEl.className   = "user-email";
      emailEl.textContent = profile.email;
      info.appendChild(emailEl);
    }
    const idEl = document.createElement("div");
    idEl.className   = "user-id";
    idEl.textContent = userId;
    info.appendChild(idEl);

    header.appendChild(info);
    card.appendChild(header);

    // Data
    const dataGrid = document.createElement("div");
    dataGrid.className = "user-data-grid";
    dataGrid.appendChild(buildQuestionnairePanel(categories, userData.scores || {}));
    dataGrid.appendChild(buildEmotionPanel(userData.emotions, userData.dominantEmotion));
    card.appendChild(dataGrid);

    container.appendChild(card);
  }
}

// ── Chargement ────────────────────────────────────────────────────────────────
if (isHistorical) {
  const raw = sessionStorage.getItem("historicalResults");
  if (raw) {
    const data = JSON.parse(raw);
    data._historical = true;
    renderResults(data);
    document.getElementById("finalCloseBtn").style.display = "none";
  } else {
    document.getElementById("statusBadge").textContent = "Résultats introuvables";
  }
} else {
  socket.emit("getResults", room);
}

socket.on("results", renderResults);

document.getElementById("finalCloseBtn").onclick = () => {
  socket.emit("deleteRoom", room);
  window.location.href = "index.html";
};
