<!DOCTYPE html>
<html lang="fr" class="page-identification">
<head>
    <meta charset="UTF-8">
    <title>Connexion professeur</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <h1>Connexion professeur</h1>
        <p><em>Connectez-vous comme enseignant</em></p>
    </header>

    <!-- CONTENU -->
    <main class="container">
        <div class="card">
            <form>

                <label for="email">Mail institutionnel</label>
                <input
                    type="email"
                    id="email"
                    placeholder="prenom.nom@u-paris.fr"
                >

                <label for="password">Mot de passe</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Mot de passe"
                >

                <button type="button" onclick="loginAdmin()" class="btn">Se connecter</button>

                <p class="link">
                    Vous n’avez pas de compte ?
                    <a href="PrincRegis.html">Créer un compte</a>
                </p>

                <p class="link">
                    <a href="index.html">← Retour à l’accueil</a>
                </p>

            </form>
        </div>
    </main>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

</body>
</html>
