<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Salle créée avec succès</title>

<link rel="stylesheet" href="create.css">
</head>

<body>

<div class="card">

  <h1>Salle créée avec succès !</h1>

  <div class="code-box">
    <p>Code de la salle :</p>
    <div class="code" id="roomCode"></div>
  </div>

  <div class="line">
    <span>Partager ce code avec vos étudiants</span>
    <a href="#" class="btn" id="copyBtn">Copier le code</a>
    
  </div>
  <p id="copyMessage" class="copy-message"></p>
  <hr>

  <div class="line">
    <span>Envoyer des questions</span>
    <a href="#" onclick="sendQuestions()" class="btn">Envoyer</a>
  </div>

  <hr>

  <div class="line">
    <span>Voir les résultats</span>
    <a href="#" onclick="viewResults()" class="btn">Voir les résultats</a>
  </div>

  <hr>

  <div class="back">
    <a href="index.html">↩ Retour à l’accueil</a>
  </div>

</div>

<script src="create.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
