<!DOCTYPE html>
<html lang="fr" class="page-inscription">
<head>
  <meta charset="UTF-8">
  <title>Inscription professeur</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Inscription professeur</h1>
    <p class="subtitle"> <em>Créer un compte pour créer une salle</em></p>

    <label>Nom</label>
    <input type="text" id="nom" placeholder="Nom">

    <label>Prénom</label>
    <input type="text" id="prenom" placeholder="Prénom">

    <label>Mail institutionnel</label>
    <input type="email" id="email" placeholder="prenom.nom@u-paris.fr">

    <label>Mot de passe</label>
    <input type="password" id="password" placeholder="Mot de passe">

    <p class="error-message" id="errorMessage">
      ⚠️ Tous les champs doivent être remplis et le mail doit être valide.
    </p>

    <!-- Lien -->
    <button type="button" class="btn" id="submitBtn" onclick="registerAdmin()">Créer un compte</button>

    <div class="bottom-link">
      Vous avez déjà un compte ?<br>
      <a href="identifprof.html">Connectez-vous →</a>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
  <script src="creesalle.js"></script>
</body>
</html>
